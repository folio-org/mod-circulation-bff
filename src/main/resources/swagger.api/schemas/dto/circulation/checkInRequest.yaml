type: object
description: Check-in request
properties:
  itemBarcode:
    description: Item barcode
    type: string
  servicePointId:
    description: ID of the service point where item is being checked-in
    type: string
    format: uuid
  checkInDate:
    description: Date and time of item check-in
    type: string
    format: date-time
  claimedReturnedResolution:
    description: Describes how the library resolved the situation where the item was claimed returned
    type: string
  sessionId:
    description: Randomly generated UUID which must be the same for all check-in requests issued in scope of the same check-in session
    type: string
    format: uuid
  inHouseUse:
    description: Explicitly registers in-house use when true; otherwise existing inference applies. Not supported in the Central tenant.
    type: boolean
  checkedOutItemInHouseUseOverride:
    description: Confirms that a checked-out item should be checked in and then registered as in-house use. Only effective when inHouseUse is true.
    type: boolean
required:
  - itemBarcode
  - servicePointId
  - checkInDate
