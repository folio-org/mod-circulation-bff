type: object
description: Check-in response
properties:
  item:
    $ref: 'checkInResponseItem.yaml'
  staffSlipContext:
    $ref: 'checkInResponseStaffSlipContext.yaml'
  loan:
    $ref: 'checkInResponseLoan.yaml'
  inHouseUse:
    description: Whether the primary check-in is considered in-house use
    type: boolean
  subsequentCheckIns:
    description: Responses of subsequent check-ins performed within the same request. Omitted for ordinary check-ins; entries are not recursive.
    type: array
    nullable: true
    items:
      type: object
      description: Result of a subsequent check-in
      properties:
        item:
          $ref: 'checkInResponseItem.yaml'
        staffSlipContext:
          $ref: 'checkInResponseStaffSlipContext.yaml'
        loan:
          $ref: 'checkInResponseLoan.yaml'
        inHouseUse:
          description: Whether this subsequent check-in is considered in-house use
          type: boolean
